# VerdeMais — Blueprint do Render
# ============================================================================
# Projeto Node + Postgres (Neon). Não há mais nada de Cloudflare aqui: sem
# wrangler, sem Vite/Pages, sem D1. As três dependências de runtime são
# hono, @hono/node-server e pg.
#
# Deploy: no painel do Render → New → Blueprint → aponte para o repositório.
# O passo a passo completo está em MIGRACAO-RENDER-NEON.md.
#
# ── REGIÃO ──────────────────────────────────────────────────────────────────
# O Render não tem região na América do Sul (Oregon, Ohio, Virginia, Frankfurt
# e Singapura). O Neon tem São Paulo, mas NÃO separe os dois: o dashboard faz
# ~35 queries por carregamento, e a ~120 ms de ida e volta entre Virginia e São
# Paulo isso vira uma tela de vários segundos. App e banco na MESMA região —
# `virginia` aqui, projeto Neon em `aws-us-east-1`.
#
# ── CARREGAMENTO ────────────────────────────────────────────────────────────
# Medido neste projeto:
#   • O servidor responde o dashboard (35 queries) em 3–5 ms. O banco não é o
#     gargalo; o custo é todo de rede.
#   • O primeiro carregamento baixava 1.447.242 bytes. Com a compressão e o
#     cache que entraram no src/server.ts, são 295.056 bytes — 4,9× menos.
#
# O que sobra é distância: o usuário em São Paulo paga ~130 ms de ida e volta
# até a Virginia, e paga isso no handshake TLS, no HTML, em cada pedaço do JS e
# em cada chamada de API. Um CDN na frente resolve a maior parte — o TLS passa
# a terminar no Brasil e os estáticos saem de um PoP local. O src/server.ts já
# manda `immutable` quando a URL traz ?v=, então qualquer CDN aproveita; e o
# src/lib/seguranca.ts lê CF-Connecting-IP e X-Forwarded-For, então o rate
# limiting continua enxergando o IP real do usuário atrás do proxy.
#
# Duas lentidões que CDN nenhum resolve:
#   • O plano free do Render hiberna: a 1ª visita após ociosidade leva ~1 min.
#     Por isso o `starter` abaixo.
#   • O Neon suspende o compute após ~5 min sem query; a consulta seguinte
#     acorda o banco e paga ~500 ms. Com tráfego real quase não acontece.

services:
  - type: web
    name: verdemais
    runtime: node
    region: virginia
    plan: starter          # o free hiberna — não use em produção
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"

      # Connection string POOLED do Neon (host com "-pooler")
      - key: DATABASE_URL
        sync: false
      - key: PG_POOL_MAX
        value: "10"

      # Sem isto o servidor se recusa a subir — não existe mais senha padrão.
      - key: ADMIN_PASSWORD
        generateValue: true

      # Envio do código de verificação. Valide o domínio no painel do Resend,
      # senão o e-mail cai em spam.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_REMETENTE
        value: "VerdeMais <nao-responda@verdemais.app>"

      # Pagamentos. O webhook agora exige este token no header
      # asaas-access-token — configure o mesmo valor no painel do Asaas.
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false

      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false

  # Recorrências, lembretes e verificação de atrasos passam a rodar sozinhos.
  # Antes só eram processados quando o usuário abria a tela correspondente —
  # quem não entrasse no app não tinha os lançamentos gerados.
  - type: cron
    name: verdemais-cron
    runtime: node
    region: virginia
    plan: starter
    schedule: "0 9 * * *"   # 06:00 em São Paulo (UTC-3) — o Render agenda em UTC
    buildCommand: npm ci && npm run build:cron
    startCommand: npm run cron
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
